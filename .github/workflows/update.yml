name: Update job listings
on:
  schedule:
    - cron: "30 1,13 * * *"   # twice daily (UTC)
  workflow_dispatch:
    inputs:
      days:
        description: "Extra time window(s) in days, e.g. 5 or 5,45 (optional)"
        required: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch jobs and send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CUSTOM_DAYS: ${{ github.event.inputs.days }}
        run: python scripts/update_jobs.py
      - name: Commit changes
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add -A JOBS.md SEARCH.md jobs.json jds windows
          git diff --staged --quiet || git commit -m "Update jobs $(date -u +'%Y-%m-%d %H:%M')"
          git push
